name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect project
        id: detect
        shell: bash
        run: |
          set -e
          workspace=$(find . -maxdepth 3 -name '*.xcworkspace' -print -quit)
          project=$(find . -maxdepth 3 -name '*.xcodeproj' -print -quit)
          if [[ -n "$workspace" ]]; then
            echo "kind=workspace" >> "$GITHUB_OUTPUT"
            echo "path=$workspace" >> "$GITHUB_OUTPUT"
          elif [[ -n "$project" ]]; then
            echo "kind=project" >> "$GITHUB_OUTPUT"
            echo "path=$project" >> "$GITHUB_OUTPUT"
          else
            echo 'Nenhum .xcodeproj ou .xcworkspace encontrado.' >&2
            exit 1
          fi
      - name: List schemes
        shell: bash
        run: |
          if [[ "${{ steps.detect.outputs.kind }}" == "workspace" ]]; then
            xcodebuild -list -workspace "${{ steps.detect.outputs.path }}"
          else
            xcodebuild -list -project "${{ steps.detect.outputs.path }}"
          fi
      - name: Build without signing
        shell: bash
        run: |
          set -e
          path="${{ steps.detect.outputs.path }}"
          if [[ "${{ steps.detect.outputs.kind }}" == "workspace" ]]; then
            scheme=$(xcodebuild -list -json -workspace "$path" | jq -r '.workspace.schemes[0]')
          else
            scheme=$(xcodebuild -list -json -project "$path" | jq -r '.project.schemes[0]')
          fi
          test -n "$scheme" && test "$scheme" != "null"
          echo "Building scheme: $scheme"
          if [[ "${{ steps.detect.outputs.kind }}" == "workspace" ]]; then
            xcodebuild -workspace "$path" -scheme "$scheme" -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          else
            xcodebuild -project "$path" -scheme "$scheme" -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          fi
      - name: Package IPA
        if: success()
        shell: bash
        run: |
          set -e
          app=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          mkdir -p ipa/Payload
          cp -R "$app" ipa/Payload/
          (cd ipa && zip -qry ../3105-compiled.ipa Payload)
      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 3105-compiled-ipa
          path: 3105-compiled.ipa
          if-no-files-found: error
      - name: Upload app artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-app
          path: build/Build/Products/Release-iphoneos
          if-no-files-found: error
